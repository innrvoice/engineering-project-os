name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate JSON
        run: python -c "import json, pathlib; [json.loads(path.read_text(encoding='utf-8')) for path in pathlib.Path('.').rglob('*.json')]"

      - name: Check manifest versions
        run: python -c "import json, pathlib; paths = [pathlib.Path('plugin.json'), pathlib.Path('.codex-plugin/plugin.json')]; assert {json.loads(path.read_text(encoding='utf-8'))['version'] for path in paths} == {'1.0.0'}"

      - name: Compile helper
        run: python -B -m compileall -q skills/project-os/scripts

      - name: Run tests
        run: python -B -m unittest discover -s tests -v
